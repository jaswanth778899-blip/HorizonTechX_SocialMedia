<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Horizon Social</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">Horizon Social</div>
    </nav>


    <!-- Login Section -->
    <main class="container">

        <section class="create-post">

            <h2>Login</h2>

            <br>

            <!-- EMAIL -->
            <input type="email" id="email" placeholder="Enter your email" style="width:100%; padding:12px; margin-bottom:10px;">

            <!-- PASSWORD -->
            <input type="password" id="password" placeholder="Enter your password" style="width:100%; padding:12px; margin-bottom:10px;">

            <!-- LOGIN BUTTON -->
            <button onclick="loginUser()">
                Login
            </button>

            <p style="margin-top:15px;">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="auth.js"></script>

</body>

</html>
